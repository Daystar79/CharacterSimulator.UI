<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Simulator Studio</title>
    <base href="/" />
    <!-- No external CDN fonts: Google Fonts blocked/slow networks leave the Photino splash forever. -->
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="splash-screen">
            <div class="splash-content">
                <div class="splash-icon">🎭</div>
                <h1>CHARACTER SIMULATOR STUDIO</h1>
                <div class="spinner"></div>
                <p>Starting desktop host…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        // Scroll a panel to the bottom after Blazor paints.
        // Double-rAF covers the frame after DOM mutation; optional second pass for late layout.
        function _scrollElToBottom(el) {
            if (!el) return;
            try {
                el.scrollTop = el.scrollHeight;
            } catch (_) { /* ignore */ }
        }

        window.scrollFeedToBottom = (elementId) => {
            const id = elementId;
            const run = () => {
                const el = document.getElementById(id);
                _scrollElToBottom(el);
            };
            // Immediate + after paint + short settle (images / flex layout)
            run();
            requestAnimationFrame(() => {
                run();
                requestAnimationFrame(run);
            });
            setTimeout(run, 50);
            setTimeout(run, 150);
        };

        /** Scroll chat + system log (and optional extra ids) to bottom. */
        window.scrollPanelsToBottom = (ids) => {
            const list = Array.isArray(ids) ? ids : (ids ? [ids] : ['dialogueFeed', 'outputLogBox', 'historyLogBox']);
            for (const id of list) {
                window.scrollFeedToBottom(id);
            }
        };
    </script>
</body>
</html>
